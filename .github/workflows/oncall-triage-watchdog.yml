name: Oncall Triage Watchdog

on:
  # Option 2: independent scheduler fires 30 min after each expected slot
  schedule:
    - cron: '30 */6 * * *'
  # Option 1: retry once when a scheduled run fails
  workflow_run:
    workflows: ["Oncall Issue Triage"]
    types: [completed]

jobs:
  retry-on-failure:
    # Only retry runs that were scheduled (not already-retried dispatches)
    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Retry failed oncall triage
        run: |
          gh workflow run oncall-triage.yml \
            --repo "${{ github.repository }}" \
            --ref "${{ github.event.workflow_run.head_branch }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trigger-if-skipped:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Check if scheduled slot was skipped
        id: check
        run: |
          LAST_RUN=$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow oncall-triage.yml \
            --limit 1 \
            --json createdAt \
            --jq '.[0].createdAt')
          if [ -z "$LAST_RUN" ] || [ "$LAST_RUN" = "null" ]; then
            echo "trigger=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LAST_TS=$(date -d "$LAST_RUN" +%s)
          NOW_TS=$(date +%s)
          ELAPSED=$(( NOW_TS - LAST_TS ))
          # Watchdog fires 30 min after the 6h slot.
          # Trigger if last run was more than 6h29m ago (23340s).
          if [ "$ELAPSED" -gt 23340 ]; then
            echo "trigger=true" >> "$GITHUB_OUTPUT"
          else
            echo "trigger=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Trigger oncall triage (skipped slot recovery)
        if: steps.check.outputs.trigger == 'true'
        run: gh workflow run oncall-triage.yml --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
